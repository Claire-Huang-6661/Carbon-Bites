/* ── API Key management (Google Gemini) ── */
function getApiKey() { return sessionStorage.getItem("cb_apikey") || ""; }
function setApiKey(k) { sessionStorage.setItem("cb_apikey", k); }
function isValidKey(k) { return k.trim().length >= 10; }

/* Gemini helper: send a request with optional image */
async function geminiCall(prompt, base64Data, mediaType, maxTokens=1500) {
  const parts = [];
  if (base64Data) {
    parts.push({ inline_data: { mime_type: mediaType, data: base64Data } });
  }
  parts.push({ text: prompt });

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getApiKey()}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: { maxOutputTokens: maxTokens, temperature: 0.3 }
      })
    }
  );
  const data = await res.json();
  console.log("Gemini response:", JSON.stringify(data).substring(0, 300));
  if (data.error) throw new Error(data.error.message + " (status: " + (data.error.code||res.status) + ")");
  if (!data.candidates || data.candidates.length === 0) throw new Error("No response from Gemini — check API key and quota");
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  if (!text) throw new Error("Empty response from Gemini");
  return text.replace(/```json|```/g, "").trim();
}

/* ── Responsive viewport hook ── */
function useVP() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 390);
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return { w, sm: w >= 640, md: w >= 900, lg: w >= 1280 };
}

/* ── Helper: file → base64 ── */
const toBase64 = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve({ data: reader.result.split(',')[1], type: file.type || 'image/jpeg' });
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

/* ── Gemini Vision: analyse restaurant menu photo ── */
async function analyzeMenu(base64Data, mediaType) {
  const prompt = `Analyse this restaurant menu image. Identify up to 6 dishes you can see.
For each dish estimate its carbon footprint in kgCO2e using these benchmarks:
beef/lamb mains: 2.5-3.5 | pork: 2.0-2.5 | chicken: 1.5-2.2 | fish/seafood: 0.5-1.2 | vegetarian: 0.3-0.9 | vegan: 0.2-0.6

Respond with ONLY valid JSON, no markdown fences:
{"dishes":[{"name":"dish name","carbon":1.23,"category":"meat|fish|vegetarian|vegan","recommendation":"one sentence carbon insight and low-carbon swap tip"}]}`;
  const clean = await geminiCall(prompt, base64Data, mediaType, 1500);
  return JSON.parse(clean);
}

/* ── Gemini Vision: identify ingredients in a fridge photo ── */
async function analyzeFridge(base64Data, mediaType) {
  const EMOJI_MAP = {tofu:"🫙",spinach:"🥬",tomato:"🍅",chickpeas:"🫘",carrot:"🥕",broccoli:"🥦",mushroom:"🍄",courgette:"🥒",aubergine:"🍆",corn:"🌽",edamame:"🫛",kimchi:"🌶️",springonion:"🌿",avocado:"🥑",mango:"🥭",lime:"🍋",rice:"🍚",pasta:"🍝",noodles:"🍜",tortilla:"🫓",bread:"🍞",egg:"🥚",cheese:"🧀",yoghurt:"🍶",salmon:"🐟",tuna:"🐠",shrimp:"🦐",chicken:"🍗",beef:"🥩",pork:"🥓"};
  const prompt = `Look at this fridge or food photo. Identify every food ingredient you can see.
Map each to the closest id from this list where possible:
tofu, spinach, tomato, chickpeas, carrot, broccoli, mushroom, courgette, aubergine, corn, edamame, kimchi, springonion, avocado, mango, lime, rice, pasta, noodles, tortilla, bread, egg, cheese, yoghurt, salmon, tuna, shrimp, chicken, beef, pork
For anything not on the list, use id "other" and describe it.

Respond with ONLY valid JSON, no markdown fences:
{"detected":[{"id":"carrot","label":"Carrot","confidence":"high"},{"id":"other","label":"Cheddar block","confidence":"medium"}]}`;
  const clean = await geminiCall(prompt, base64Data, mediaType, 1000);
  const parsed = JSON.parse(clean);
  parsed.detected = parsed.detected.map(d => ({ ...d, emoji: EMOJI_MAP[d.id] || "🥘" }));
  return parsed;
}


/* ── Gemini Vision: analyse a photo of an actual prepared meal ── */
async function analyzeMeal(base64Data, mediaType) {
  const prompt = `You are a carbon footprint expert. Analyse this photo of a prepared meal and estimate its carbon footprint.

Identify every visible food component on the plate (proteins, carbs, vegetables, sauces, dairy, garnishes etc).

Carbon benchmarks per serving:
- Beef/lamb: 2.5-4.0 kgCO2e  - Pork: 1.8-2.5  - Chicken: 1.2-2.0
- Fish/seafood: 0.4-1.2  - Eggs: 0.3-0.6  - Dairy/cheese: 0.3-0.8
- Pasta/rice/bread: 0.2-0.5  - Vegetables: 0.05-0.25  - Legumes/tofu: 0.1-0.3

Respond with ONLY valid JSON, no markdown:
{"meal_name":"Short meal name","total_carbon":1.85,"portion":"small|medium|large","components":[{"name":"component","carbon":0.45,"emoji":"emoji","category":"meat|fish|grain|vegetable|dairy|legume|other"}],"carbon_level":"very_low|low|medium|high|very_high","ual_avg_comparison":"e.g. 12% below UAL average (2.1 kgCO2e)","swap_tip":"One concrete swap with estimated saving","low_carbon_version":"Alternative dish name (~X.X kgCO2e)"}`;
  const clean = await geminiCall(prompt, base64Data, mediaType, 1500);
  return JSON.parse(clean);
}

/* ── Claude API: generate recipe from actual ingredients + cuisine ── */
async function generateRecipe(ingredientList, cuisineStyle, carbonTotal) {
  const cuisineLabel = cuisineStyle === "any" ? "any style (choose what fits best)"
    : cuisineStyle === "random" ? "a surprising cuisine of your choice"
    : cuisineStyle;

  const prompt = `You are a sustainable food chef. A student has placed the following ingredients on their plate:
${ingredientList.map(i => `- ${i.label} (${i.emoji}, carbon: ${i.carbon} kgCO₂e/£, protein: ${i.protein}g)`).join("\n")}

Total estimated carbon: ${carbonTotal.toFixed(2)} kgCO₂e.
Requested cuisine style: ${cuisineLabel}.

Generate a low-carbon recipe using ONLY these ingredients (or a sensible subset). Do NOT add ingredients not on the list unless they are basic pantry staples (salt, pepper, oil, garlic, water, soy sauce, vinegar).

Respond with ONLY valid JSON (no markdown, no explanation) in this exact format:
{
  "name": "Recipe Name",
  "time": "XX min",
  "serves": 2,
  "difficulty": "Easy",
  "tip": "One short chef's tip about why this is a low-carbon choice",
  "carbon_saved": "X.X",
  "steps": [
    "Step 1 instruction",
    "Step 2 instruction",
    "Step 3 instruction",
    "Step 4 instruction",
    "Step 5 instruction"
  ]
}`;

  const clean = await geminiCall(prompt, null, null, 1000);
  return JSON.parse(clean);
}

/* ── Outside Dining ── */
function OutsideScreen({onBack,vp={}}) {
  const [outerTab,setOuterTab]=useState("meal");   // meal | menu
  const [stage,setStage]=useState("upload");
  const [previewUrl,setPreviewUrl]=useState(null);
  const [imageFile,setImageFile]=useState(null);
  const [results,setResults]=useState(null);
  const [errMsg,setErrMsg]=useState("");
  const cameraRef=React.useRef();
  const galleryRef=React.useRef();

  const handleFile = file => {
    if(!file) return;
    setImageFile(file);
    setPreviewUrl(URL.createObjectURL(file));
    setStage("preview");
  };

  const runScan = async () => {
    setStage("scanning");
    setErrMsg("");
    try {
      const {data, type} = await toBase64(imageFile);
      const res = await analyzeMenu(data, type);
      setResults(res.dishes || []);
      setStage("results");
    } catch(e) {
      setErrMsg("Couldn't analyse the image — try a clearer photo of the menu.");
      setStage("error");
    }
  };

  const runDemo = async () => {
    setStage("scanning");
    // Use a real demo image URL converted to demo call — fall back to mock
    await new Promise(r=>setTimeout(r,2200));
    setResults([
      {name:"Grilled Salmon & Salad",   carbon:0.62, category:"fish",        recommendation:"Excellent low-carbon choice. Salmon has a fraction of the footprint of red meat."},

      {name:"Double Beef Burger & Fries",carbon:3.41, category:"meat",        recommendation:"Very high carbon. Swapping to a plant-based patty saves ~2.1 kgCO₂e."},
      {name:"Wild Mushroom Risotto",     carbon:0.84, category:"vegetarian",  recommendation:"Great plant-based option — a sustainable Italian classic."},
    ]);
    setStage("results");

    setStage("upload"); setPreviewUrl(null); setImageFile(null); setResults(null); setErrMsg("");

      {stage==="preview"&&<div style={{animation:"fadeUp 0.3s ease"}}>

        <div style={{borderRadius:20,overflow:"hidden",marginBottom:20,border:"1px solid #2A4A3A",background:"#142A22"}}>
          <img src={previewUrl} alt="menu" style={{width:"100%",maxHeight:340,objectFit:"cover",display:"block"}}/>
        </div>
        <button onClick={runScan}
          style={{width:"100%",background:"#8BFF6E",border:"none",borderRadius:16,padding:16,fontSize:16,fontWeight:700,color:"#0A1A12",marginBottom:12}}>
          🔍 Analyse This Menu
        </button>
        <button onClick={reset}
          style={{width:"100%",background:"transparent",border:"1px solid #2A4A3A",borderRadius:16,padding:14,fontSize:14,color:"#5a7a6a"}}>
          ← Try a Different Photo
        </button>
      </div>}

      {/* ── SCANNING ── */}
      {stage==="scanning"&&<div style={{textAlign:"center",paddingTop:60}}>
        <div style={{position:"relative",width:130,height:130,margin:"0 auto 28px"}}>
          <div style={{position:"absolute",inset:0,borderRadius:"50%",background:"#8BFF6E08",animation:"pulse 1.6s ease-in-out infinite"}}/>
          <div style={{position:"absolute",inset:14,borderRadius:"50%",background:"#8BFF6E14",animation:"pulse 1.6s ease-in-out infinite 0.3s"}}/>
          <div style={{position:"absolute",inset:28,borderRadius:"50%",background:"#8BFF6E22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:38}}>🔍</div>
          <svg style={{position:"absolute",inset:0,animation:"spinRing 2s linear infinite"}} viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="60" fill="none" stroke="#8BFF6E" strokeWidth="2.5" strokeDasharray="50 330" strokeLinecap="round"/>
          </svg>
        </div>
        <p style={{color:"#E8F5E3",fontSize:20,fontWeight:600,marginBottom:8}}>Reading the menu…</p>
        <p style={{color:"#5a7a6a",fontSize:14,lineHeight:1.7}}>Claude AI is identifying dishes<br/>and calculating carbon footprint</p>
        <div style={{marginTop:28,display:"inline-flex",flexDirection:"column",gap:14,textAlign:"left"}}>
          {["Reading menu text","Identifying dishes","Looking up carbon data","Preparing recommendations"].map((l,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:18,height:18,borderRadius:"50%",background:"#8BFF6E22",border:"1px solid #8BFF6E44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,animation:`pulse ${1+i*0.3}s ease-in-out infinite`}}>✦</div>
              <span style={{color:"#5a7a6a",fontSize:13}}>{l}</span>
            </div>
          ))}
        </div>
      </div>}

      {/* ── ERROR ── */}
      {stage==="error"&&<div style={{textAlign:"center",paddingTop:40,animation:"fadeUp 0.3s ease"}}>
        <div style={{fontSize:56,marginBottom:16}}>😕</div>
        <p style={{color:"#E8F5E3",fontSize:18,fontWeight:600,marginBottom:8}}>Couldn't read the menu</p>
        <p style={{color:"#5a7a6a",fontSize:14,marginBottom:28,lineHeight:1.6}}>{errMsg}</p>
        <button onClick={reset} style={{background:"#8BFF6E",border:"none",borderRadius:16,padding:"14px 32px",color:"#0A1A12",fontSize:15,fontWeight:700}}>Try Again</button>
      </div>}

      {/* ── RESULTS ── */}
      {stage==="results"&&results&&<div style={{animation:"fadeUp 0.3s ease"}}>
        {/* Preview thumbnail */}
        {previewUrl&&<div style={{borderRadius:14,overflow:"hidden",marginBottom:16,border:"1px solid #2A4A3A",height:100}}>
          <img src={previewUrl} alt="menu" style={{width:"100%",height:"100%",objectFit:"cover",opacity:0.7}}/>
        </div>}

        <div style={{background:"#1C3A2A",border:"1px solid #8BFF6E22",borderRadius:16,padding:16,marginBottom:20}}>
          <p style={{color:"#8BFF6E",fontSize:13,fontWeight:600,margin:"0 0 3px"}}>✓ Analysis complete · {results.length} dishes found</p>
          <p style={{color:"#5a7a6a",fontSize:12,margin:0}}>Tap any dish for carbon details</p>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {results.map((r,i)=>(
            <div key={i} style={{background:"#142A22",border:"1px solid #2A4A3A",borderRadius:18,padding:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,gap:10}}>
                <span style={{color:"#E8F5E3",fontSize:16,fontWeight:600,lineHeight:1.3,flex:1}}>{r.name}</span>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                  <Badge v={r.carbon} sm={true}/>
                  <span style={{background:catColor(r.category)+"22",border:`1px solid ${catColor(r.category)}44`,color:catColor(r.category),fontSize:9,borderRadius:6,padding:"2px 8px",fontFamily:"'Space Mono',monospace",textTransform:"uppercase"}}>{r.category}</span>
                </div>
              </div>
              <div style={{background:"#0A1A12",borderRadius:6,height:6,overflow:"hidden",marginBottom:12}}>
                <div style={{height:"100%",width:`${Math.min((r.carbon/4)*100,100)}%`,background:`linear-gradient(90deg,#8BFF6E,${cc(r.carbon)})`,borderRadius:6,transition:"width 0.8s ease"}}/>
              </div>
              <p style={{color:"#7aaa8a",fontSize:13,margin:0,lineHeight:1.6}}>{r.recommendation}</p>
            </div>
          ))}
        </div>

        {/* Summary */}
        <div style={{background:"#142A22",border:"1px solid #2A4A3A",borderRadius:18,padding:20,marginTop:16}}>
          <p style={{color:"#5a7a6a",fontSize:11,letterSpacing:2,margin:"0 0 10px",fontFamily:"'Space Mono',monospace"}}>LOWEST CARBON CHOICE</p>
          {(()=>{const best=results.reduce((a,b)=>a.carbon<b.carbon?a:b);return(
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <p style={{color:"#8BFF6E",fontSize:15,fontWeight:600,margin:0,flex:1}}>🌿 {best.name}</p>
              <Badge v={best.carbon} sm={true}/>
            </div>
          );})()}
        </div>

        <button onClick={reset} style={{width:"100%",marginTop:16,background:"transparent",border:"1px solid #2A4A3A",borderRadius:16,padding:14,color:"#7aaa8a",fontSize:14}}>
          📷 Scan Another Menu
        </button>
      </div>}
      </div>}
    </div>
  );
}

/* ── Cook at Home ── */
function SelfCookScreen({onBack,vp={}}) {
  const [tab,setTab]=useState("build");
  const [plate,setPlate]=useState([]);
  const [cuisine,setCuisine]=useState("any");
  const [recipe,setRecipe]=useState(null);
  const [recipeLoading,setRecipeLoading]=useState(false);
  const [recipeError,setRecipeError]=useState(null);
  const [fridgeStage,setFridgeStage]=useState("idle");   // idle | scanning | detected
  const [fridgeImageFile,setFridgeImageFile]=useState(null);
  const [fridgePreviewUrl,setFridgePreviewUrl]=useState(null);
  const [detected,setDetected]=useState([]);
  const [fridgeCuisine,setFridgeCuisine]=useState("any");
  const [fridgeRecipe,setFridgeRecipe]=useState(null);
  const [fridgeRecipeLoading,setFridgeRecipeLoading]=useState(false);
  const [fridgeRecipeError,setFridgeRecipeError]=useState(null);
  const fridgeCameraRef=React.useRef();
  const fridgeGalleryRef=React.useRef();

  const handleFridgeFile = async file => {
    if(!file) return;
    setFridgeImageFile(file);
    setFridgePreviewUrl(URL.createObjectURL(file));
    // Immediately start scanning
    setFridgeStage("scanning");
    try {
      const {data, type} = await toBase64(file);
      const res = await analyzeFridge(data, type);
      // Merge with INGREDIENTS for carbon data
      const enriched = res.detected.map(d => {
        const known = INGREDIENTS.find(i => i.id === d.id);
        return known ? {...known, confidence: d.confidence} : {id:d.id, label:d.label, emoji:d.emoji, carbon:0.15, protein:0, kcal:0, confidence:d.confidence};
      });
      setDetected(enriched);
      setFridgeStage("detected");
    } catch(e) {
      // Fall back to demo on error
      setDetected(FRIDGE_MOCK.map(d=>({...INGREDIENTS.find(i=>i.id===d.id)||d, confidence:"high"})));
      setFridgeStage("detected");
    }
  };

  const startDemoScan = () => {
    setFridgeStage("scanning");
    setFridgePreviewUrl(null);
    let p=0;
    const t=setInterval(()=>{
      p+=Math.random()*13;
      if(p>=100){
        clearInterval(t);
        setTimeout(()=>{
          setDetected(FRIDGE_MOCK.map(d=>({...INGREDIENTS.find(i=>i.id===d.id)||d, confidence:"high"})));
          setFridgeStage("detected");
        },500);
      }
    },180);
  };

  const totalC=plate.reduce((s,id)=>{const i=INGREDIENTS.find(x=>x.id===id);return s+(i?i.carbon*0.5:0);},0);
  const totalP=plate.reduce((s,id)=>{const i=INGREDIENTS.find(x=>x.id===id);return s+(i?i.protein:0);},0);
  const totalK=plate.reduce((s,id)=>{const i=INGREDIENTS.find(x=>x.id===id);return s+(i?i.kcal:0);},0);
  const hasMeat=plate.some(id=>["chicken","beef","pork"].includes(id));
  const togIng=id=>{setPlate(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setRecipe(null);setRecipeError(null);};

  const handleGenerateRecipe=async()=>{
    if(plate.length===0){setRecipeError("Please add ingredients first!");return;}
    if(!getApiKey()){setRecipeError("Please set your Gemini API Key first — click SET KEY button.");return;}
    setRecipeLoading(true);setRecipe(null);setRecipeError(null);
    try{
      const ings=plate.map(id=>INGREDIENTS.find(x=>x.id===id)).filter(Boolean);
      const r=await generateRecipe(ings,cuisine,totalC);
      setRecipe(r);
    }catch(e){
      console.error("Recipe error:",e);
      setRecipeError("Error: "+e.message);
    }
    setRecipeLoading(false);
  };

  const handleFridgeRecipe=async()=>{
    setFridgeRecipeLoading(true);setFridgeRecipe(null);setFridgeRecipeError(null);
    try{
      const ings=detected.filter(d=>d.carbon!==undefined);
      const r=await generateRecipe(ings,fridgeCuisine,ings.reduce((s,i)=>s+(i.carbon*0.5),0));
      setFridgeRecipe(r);
    }catch(e){
      console.error("Fridge recipe error:",e);
      setFridgeRecipeError("Error: "+e.message);
    }
    setFridgeRecipeLoading(false);
  };
  return (
    <div style={{minHeight:"100vh",background:"#0A1A12",fontFamily:"'DM Sans',sans-serif",paddingBottom:120}}>
      <div style={{padding:"24px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <BackBtn onClick={onBack}/>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#E8F5E3",margin:0}}>Cook at Home</h2>
        <div/>
      </div>
      {/* Tab */}
      <div style={{display:"flex",margin:"0 24px 20px",background:"#0f2018",borderRadius:16,padding:4,border:"1px solid #1E3828"}}>
        {[["build","🍽️ Plate"],["scan","📸 My Meal"],["fridge","🧊 Fridge"]].map(([t,l])=>(
          <button key={t} onClick={()=>setTab(t)}
            style={{flex:1,padding:"11px 6px",borderRadius:12,border:"none",
              background:tab===t?"#8BFF6E":"transparent",color:tab===t?"#0A1A12":"#5a7a6a",
              fontWeight:700,fontSize:12,transition:"all 0.25s"}}>{l}</button>
        ))}
      </div>

      {/* SCAN MY MEAL */}
      {tab==="scan"&&<div style={{padding:"0 24px",animation:"fadeUp 0.3s ease"}}>
        <MealScanPanel context="cook"/>
      </div>}

      {/* BUILD */}
      {tab==="build"&&<div style={{animation:"fadeUp 0.3s ease"}}>
        {/* Plate */}
        <div style={{textAlign:"center",padding:"0 24px 16px"}}>
          <div style={{width:220,height:220,borderRadius:"50%",margin:"0 auto",background:"#142A22",
            border:plate.length>0?`3px solid ${cc(totalC)}`:"3px dashed #2A4A3A",
            display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"center",
            gap:4,padding:22,transition:"all 0.4s",
            boxShadow:plate.length>0?`0 0 55px ${cc(totalC)}28`:"none"}}>
            {plate.length===0
              ?<p style={{color:"#2A4A3A",fontSize:12,textAlign:"center",margin:0,lineHeight:1.8}}>
                 Tap ingredients below<br/>to build your plate.<br/>
                 <span style={{fontSize:10}}>Tap again to remove.</span></p>
              :plate.map(id=>{const i=INGREDIENTS.find(x=>x.id===id);return i?(
                <button key={id} onClick={()=>togIng(id)}
                  style={{background:"none",border:"none",fontSize:24,padding:2,lineHeight:1,transition:"transform 0.15s",borderRadius:8}}
                  onMouseEnter={e=>e.currentTarget.style.transform="scale(0.65) rotate(-10deg)"}
                  onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>{i.emoji}</button>):null;})
            }
          </div>
          {plate.length>0&&<div style={{marginTop:14,animation:"fadeUp 0.3s ease"}}>
            <Badge v={totalC}/>
            <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
              <span style={{background:"#142A22",border:"1px solid #2A4A3A",color:"#7aaa8a",fontSize:12,borderRadius:10,padding:"4px 12px"}}>~{totalK} kcal</span>
              <span style={{background:"#142A22",border:"1px solid #2A4A3A",color:"#7aaa8a",fontSize:12,borderRadius:10,padding:"4px 12px"}}>{totalP}g protein</span>
            </div>
            <div style={{margin:"12px auto 0",maxWidth:240,display:"flex",alignItems:"center",gap:8}}>
              <span style={{color:"#8BFF6E",fontSize:10,fontFamily:"'Space Mono',monospace"}}>LOW</span>
              <div style={{flex:1,background:"#142A22",borderRadius:6,height:7,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min((totalC/4)*100,100)}%`,background:"linear-gradient(90deg,#8BFF6E,#FFD166,#FF5A5A)",borderRadius:6,transition:"width 0.5s"}}/>
              </div>
              <span style={{color:"#FF5A5A",fontSize:10,fontFamily:"'Space Mono',monospace"}}>HIGH</span>
            </div>
            <p style={{margin:"6px 0 0",color:cc(totalC),fontSize:13,fontWeight:600}}>{cl(totalC)} Carbon · {mt(totalC).i} {mt(totalC).t}</p>
            <p style={{margin:"3px 0 0",color:"#3a5a4a",fontSize:11}}>Tap any ingredient on the plate to remove it</p>
          </div>}
        </div>
        {hasMeat&&<div style={{margin:"0 24px 14px",background:"#FF5A5A0D",border:"1px solid #FF5A5A2A",borderRadius:16,padding:16,animation:"fadeUp 0.3s ease"}}>
          <p style={{color:"#FF8A8A",fontSize:14,margin:"0 0 5px",fontWeight:600}}>⚠ High-carbon meat detected</p>
          <p style={{color:"#5a7a6a",fontSize:13,margin:0}}>Swap for tofu or chickpeas → cut carbon up to <strong style={{color:"#8BFF6E"}}>70%</strong>.</p>
        </div>}
        {/* Ingredient groups */}
        <div style={{padding:"0 24px 20px"}}>
          {ING_GROUPS.map(({g,ids})=>{
            const isMeat=g==="Meat";
            return <div key={g} style={{marginBottom:22}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <span style={{color:isMeat?"#FF8A8A":"#7aaa8a",fontSize:11,fontWeight:700,fontFamily:"'Space Mono',monospace",letterSpacing:1}}>{g.toUpperCase()}</span>
                {isMeat&&<span style={{background:"#FF5A5A22",border:"1px solid #FF5A5A44",color:"#FF8A8A",fontSize:9,borderRadius:6,padding:"2px 8px",fontFamily:"'Space Mono',monospace"}}>HIGH CARBON</span>}
                <div style={{flex:1,height:1,background:"#1E3828"}}/>
                <span style={{color:"#3a5a4a",fontSize:10,fontFamily:"'Space Mono',monospace"}}>{ids.filter(id=>plate.includes(id)).length}/{ids.length}</span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {ids.map(id=>{
                  const ing=INGREDIENTS.find(i=>i.id===id);if(!ing)return null;
                  const sel=plate.includes(id);
                  const isMeatIng=["chicken","beef","pork"].includes(id);
                  return <button key={id} onClick={()=>togIng(id)}
                    style={{background:sel?cc(ing.carbon)+"22":"#142A22",
                      border:sel?`2px solid ${cc(ing.carbon)}`:`1px solid ${isMeatIng?"#FF5A5A44":"#2A4A3A"}`,
                      borderRadius:14,padding:"10px 12px",display:"flex",flexDirection:"column",alignItems:"center",
                      gap:3,transition:"all 0.2s",position:"relative",minWidth:72}}>
                    {sel&&<span style={{position:"absolute",top:-6,right:-6,background:cc(ing.carbon),borderRadius:"50%",width:16,height:16,fontSize:9,display:"flex",alignItems:"center",justifyContent:"center",color:"#0A1A12",fontWeight:700}}>✓</span>}
                    {isMeatIng&&!sel&&<span style={{position:"absolute",top:-5,right:-5,background:"#FF5A5A",borderRadius:"50%",width:14,height:14,fontSize:8,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700}}>!</span>}
                    <span style={{fontSize:22}}>{ing.emoji}</span>
                    <span style={{color:sel?cc(ing.carbon):"#E8F5E3",fontSize:11,fontWeight:600,textAlign:"center"}}>{ing.label}</span>
                    <span style={{color:"#3a5a4a",fontSize:9,fontFamily:"'Space Mono',monospace"}}>{ing.carbon}/£</span>
                    {sel&&<span style={{color:cc(ing.carbon),fontSize:9}}>{ing.protein}g pro</span>}
                  </button>;
                })}
              </div>
            </div>;
          })}
        </div>
        {/* Cuisine + Recipe */}
        <div style={{padding:"0 24px"}}>
          <p style={{color:"#5a7a6a",fontSize:11,letterSpacing:2,marginBottom:14,fontFamily:"'Space Mono',monospace"}}>CHOOSE A CUISINE STYLE</p>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
            {CUISINE_LIST.map(c=>(
              <button key={c.id} onClick={()=>{setCuisine(c.id);setRecipe(null);setRecipeError(null);}}
                style={{background:cuisine===c.id?c.color+"1A":"#142A22",border:cuisine===c.id?`1.5px solid ${c.color}`:"1px solid #2A4A3A",
                  borderRadius:20,padding:"8px 14px",color:cuisine===c.id?c.color:"#7aaa8a",
                  fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6,transition:"all 0.2s"}}>
                <span>{c.emoji}</span>{c.label}
              </button>
            ))}
          </div>
          {/* Generate button */}
          <button onClick={handleGenerateRecipe} disabled={recipeLoading||plate.length===0}
            style={{width:"100%",background:plate.length===0?"#1a3020":"#8BFF6E",border:"none",borderRadius:16,padding:16,fontSize:16,fontWeight:700,
              color:plate.length===0?"#3a5a4a":"#0A1A12",opacity:recipeLoading?0.8:1,transition:"all 0.2s"}}>
            {recipeLoading?"⏳ Generating your recipe…":"✨ Generate Recipe from My Plate"}
          </button>

          {/* Ingredient reminder */}
          {plate.length===0&&<p style={{color:"#3a5a4a",fontSize:12,textAlign:"center",marginTop:8}}>Add ingredients to your plate above first</p>}

          {/* Loading spinner */}
          {recipeLoading&&<div style={{marginTop:16,background:"#142A22",border:"1px solid #2A4A3A",borderRadius:20,padding:32,textAlign:"center",animation:"fadeUp 0.3s ease"}}>
            <div style={{display:"inline-block",animation:"spin 1.2s linear infinite",fontSize:32,marginBottom:14}}>🍳</div>
            <p style={{color:"#E8F5E3",fontSize:16,fontWeight:600,margin:"0 0 6px"}}>Creating your recipe…</p>
            <p style={{color:"#5a7a6a",fontSize:13,margin:0}}>
              Based on: {plate.map(id=>INGREDIENTS.find(x=>x.id===id)?.emoji).filter(Boolean).join(" ")}
            </p>
          </div>}

          {/* Error */}
          {recipeError&&<div style={{marginTop:14,background:"#FF5A5A0D",border:"1px solid #FF5A5A33",borderRadius:14,padding:16}}>
            <p style={{color:"#FF8A8A",fontSize:13,margin:0}}>⚠ {recipeError}</p>
          </div>}

          {/* AI-generated recipe */}
          {recipe&&!recipeLoading&&<div style={{marginTop:16,background:"#142A22",border:"1px solid #2A4A3A",borderRadius:20,padding:24,animation:"fadeUp 0.35s ease"}}>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{background:"#8BFF6E22",border:"1px solid #8BFF6E44",color:"#8BFF6E",fontSize:10,borderRadius:8,padding:"3px 10px",fontFamily:"'Space Mono',monospace",fontWeight:700,whiteSpace:"nowrap"}}>
                    ✨ AI RECIPE
                  </span>
                  <span style={{background:"#8BFF6E22",border:"1px solid #8BFF6E44",color:"#8BFF6E",fontSize:10,borderRadius:8,padding:"3px 10px",fontFamily:"'Space Mono',monospace",whiteSpace:"nowrap"}}>
                    {CUISINE_LIST.find(c=>c.id===cuisine)?.emoji} {CUISINE_LIST.find(c=>c.id===cuisine)?.label}
                  </span>
                </div>
                <h3 style={{color:"#E8F5E3",fontSize:21,margin:0,fontFamily:"'Cormorant Garamond',serif",fontWeight:600,lineHeight:1.2}}>{recipe.name}</h3>
              </div>
              <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                <p style={{color:"#7aaa8a",fontSize:12,margin:"0 0 3px"}}>⏱ {recipe.time}</p>
                <p style={{color:"#7aaa8a",fontSize:12,margin:"0 0 3px"}}>👤 {recipe.serves} serves</p>

              </div>
            </div>

          </div>}

          {fridgeRecipe&&!fridgeRecipeLoading&&<div style={{marginTop:16,background:"#142A22",border:"1px solid #2A4A3A",borderRadius:20,padding:24,animation:"fadeUp 0.4s ease"}}>

            <h3 style={{color:"#E8F5E3",fontSize:20,margin:"0 0 6px",fontFamily:"'Cormorant Garamond',serif",fontWeight:600}}>{fridgeRecipe.name}</h3>
            <div style={{display:"flex",gap:14,marginBottom:16}}>
              <span style={{color:"#7aaa8a",fontSize:12}}>⏱ {fridgeRecipe.time}</span>
              <span style={{color:"#7aaa8a",fontSize:12}}>👤 {fridgeRecipe.serves} serves</span>
              <span style={{color:"#7aaa8a",fontSize:12}}>📊 {fridgeRecipe.difficulty}</span>
            </div>
            {fridgeRecipe.steps.map((step,i)=>(<div key={i} style={{display:"flex",gap:14,marginBottom:12}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:"#8BFF6E22",border:"1px solid #8BFF6E44",
                color:"#8BFF6E",fontSize:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                fontFamily:"'Space Mono',monospace",fontWeight:700}}>{i+1}</div>
              <p style={{color:"#c0d8c8",fontSize:14,margin:0,lineHeight:1.6,paddingTop:2}}>{step}</p>
            </div>))}
            {fridgeRecipe.tip&&<div style={{background:"#FFD16611",border:"1px solid #FFD16633",borderRadius:12,padding:"12px 16px",margin:"12px 0"}}>
              <p style={{color:"#FFD166",fontSize:13,margin:0,lineHeight:1.5}}>💡 <strong>Chef's tip:</strong> {fridgeRecipe.tip}</p>
            </div>}
            <div style={{background:"#8BFF6E0D",border:"1px solid #8BFF6E22",borderRadius:12,padding:"12px 16px",marginTop:fridgeRecipe.tip?0:12}}>
              <p style={{color:"#8BFF6E",fontSize:14,margin:0}}>🌱 Uses what you have · Saves ~{fridgeRecipe.carbon_saved} kgCO₂e vs meat</p>
            </div>
            <button onClick={handleFridgeRecipe} style={{width:"100%",marginTop:12,background:"transparent",border:"1px solid #8BFF6E44",borderRadius:14,padding:12,color:"#8BFF6E",fontSize:13,fontWeight:600}}>
              🔄 Try a different recipe
            </button>
          </div>}

          <button onClick={()=>{setFridgeStage("idle");setDetected([]);setFridgeRecipe(null);setFridgeRecipeError(null);setFridgePreviewUrl(null);setFridgeImageFile(null);}}
            style={{width:"100%",marginTop:14,background:"transparent",border:"1px solid #2A4A3A",borderRadius:14,padding:12,color:"#5a7a6a",fontSize:13}}>
            🔄 Scan another fridge
          </button>
        </div>}
      </div>}
    </div>
  );
}

/* ── Report ── */
function ReportScreen({onBack,vp={}}) {
  const wd=[{d:"Mon",c:2.1},{d:"Tue",c:0.8},{d:"Wed",c:1.4},{d:"Thu",c:3.1},{d:"Fri",c:0.6},{d:"Sat",c:1.9},{d:"Sun",c:0.7}];
  const tot=wd.reduce((s,x)=>s+x.c,0).toFixed(1);
  const maxC=Math.max(...wd.map(x=>x.c));
  return (
    <div style={{minHeight:"100vh",background:"#0A1A12",fontFamily:"'DM Sans',sans-serif",padding:24,paddingBottom:100}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>

        <p style={{color:"#5a7a6a",fontSize:11,letterSpacing:2,margin:"0 0 8px",fontFamily:"'Space Mono',monospace"}}>THIS WEEK'S TOTAL</p>

        <p style={{color:"#5a7a6a",fontSize:18,margin:"8px 0 16px"}}>kgCO₂e</p>
        <p style={{color:"#c0d8c8",fontSize:15,margin:0}}>🌍 Equivalent to driving <strong style={{color:"#FFD166"}}>{Math.round(parseFloat(tot)/0.21)} km</strong> by car</p>
        <p style={{color:"#8BFF6E",fontSize:14,marginTop:10}}>↓ 22% below UAL weekly average</p>

      <div style={{background:"#142A22",border:"1px solid #2A4A3A",borderRadius:20,padding:24,marginBottom:16}}>

        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:110}}>
          {wd.map(x=>(
            <div key={x.d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <span style={{color:cc(x.c),fontSize:10,fontFamily:"'Space Mono',monospace"}}>{x.c}</span>
              <div style={{width:"100%",borderRadius:"5px 5px 0 0",height:`${(x.c/maxC)*76}px`,background:`linear-gradient(180deg,${cc(x.c)},${cc(x.c)}88)`,transition:"height 0.6s"}}/>

            </div>
          ))}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{l:"Daily Avg",v:"1.51",u:"kgCO₂e",s:"vs 2.1 UAL avg"},
          {l:"Best Day",v:"Fri",u:"0.6 kgCO₂e",s:"Lentil dal + soup"},
          {l:"High Day",v:"Thu",u:"3.1 kgCO₂e",s:"Beef burger",a:true},
          {l:"Meals",v:"18",u:"meals",s:"Across 7 days"}].map((s,i)=>(
          <div key={i} style={{background:s.a?"#FF5A5A0D":"#142A22",border:s.a?"1px solid #FF5A5A33":"1px solid #2A4A3A",borderRadius:16,padding:18}}>

            <p style={{color:s.a?"#FF8A8A":"#E8F5E3",fontSize:24,fontWeight:700,margin:"0 0 2px",fontFamily:"'Space Mono',monospace"}}>{s.v}</p>
            <p style={{color:"#5a7a6a",fontSize:12,margin:"0 0 4px"}}>{s.u}</p>
            <p style={{color:s.a?"#FF8A8A":"#8BFF6E",fontSize:12,margin:0}}>{s.s}</p>

        ))}
      </div>
      <div style={{background:"#1C3A2A",border:"1px solid #8BFF6E22",borderRadius:18,padding:20}}>
        <p style={{color:"#5a7a6a",fontSize:11,letterSpacing:2,margin:"0 0 10px",fontFamily:"'Space Mono',monospace"}}>💡 PERSONALISED INSIGHT</p>
        <p style={{color:"#E8F5E3",fontSize:15,margin:"0 0 14px",lineHeight:1.6}}>
          Your highest-carbon days are driven by <strong>meat-based lunches</strong>. Swapping Thursday's beef burger for the lentil dal would save <strong style={{color:"#8BFF6E"}}>2.3 kgCO₂e</strong> — your entire Tuesday footprint.

/* ── Root App ── */
function App() {
  const vp = useVP();
  const [screen,setScreen]=useState("welcome");
  const [role,setRole]=useState(null);
  const [collegeId,setCollegeId]=useState(null);
  const [prev,setPrev]=useState(null);
  const [showKeyModal,setShowKeyModal]=useState(false);
  const [hasKey,setHasKey]=useState(!!getApiKey());
  const go=to=>{setPrev(screen);setScreen(to);};
  const back=()=>setScreen(prev||"home");
  const handleRole=r=>{setRole(r);go(r==="student"?"college":"home");};
  const showNav=screen!=="welcome"&&screen!=="college";
  const handleKeyClose=()=>{ setShowKeyModal(false); setHasKey(!!getApiKey()); };

  const NAV=[{id:"home",e:"🏠",l:"Home"},{id:"canteen",e:"🏫",l:"Canteen"},
             {id:"selfcook",e:"👨‍🍳",l:"Cook"},{id:"report",e:"📊",l:"Report"}];

  const maxW = vp.lg ? 1280 : vp.md ? 1000 : "100%";

  return (
    <div style={{background:"#0A1A12",minHeight:"100vh"}}>

      {/* ── TOP NAV (desktop md+) ── */}
      {showNav && vp.md && (
        <div style={{position:"sticky",top:0,zIndex:100,background:"rgba(10,26,18,0.96)",
          backdropFilter:"blur(16px)",borderBottom:"1px solid #1E3828"}}>
          <div style={{maxWidth:maxW,margin:"0 auto",padding:"0 40px",
            display:"flex",alignItems:"center",justifyContent:"space-between",height:60}}>
            <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#8BFF6E",fontStyle:"italic",fontWeight:600}}>
              Carbon Bites
            </span>
            <div style={{display:"flex",gap:6}}>
              {NAV.map(t=>(
                <button key={t.id} onClick={()=>go(t.id)}
                  style={{background:screen===t.id?"#8BFF6E1A":"transparent",
                    border:`1px solid ${screen===t.id?"#8BFF6E44":"transparent"}`,
                    borderRadius:20,padding:"7px 18px",color:screen===t.id?"#8BFF6E":"#5a7a6a",
                    display:"flex",alignItems:"center",gap:7,fontSize:13,fontWeight:600,
                    transition:"all 0.2s"}}>
                  <span style={{fontSize:16}}>{t.e}</span>
                  <span style={{fontFamily:"'Space Mono',monospace",fontSize:11,letterSpacing:0.5}}>{t.l.toUpperCase()}</span>
                </button>
              ))}
            </div>
            {/* API Key button */}
            <button onClick={()=>setShowKeyModal(true)}
              style={{background:hasKey?"#8BFF6E1A":"#FF9F471A",
                border:`1px solid ${hasKey?"#8BFF6E44":"#FF9F4766"}`,
                borderRadius:20,padding:"7px 16px",
                color:hasKey?"#8BFF6E":"#FF9F47",
                display:"flex",alignItems:"center",gap:7,fontSize:12,fontWeight:600,
                transition:"all 0.2s",marginLeft:8}}>
              <span>{hasKey?"🔑":"⚠️"}</span>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,letterSpacing:0.5}}>
                {hasKey?"API KEY SET":"SET API KEY"}
              </span>
            </button>
          </div>
        </div>
      )}

      {/* ── FLOATING KEY BUTTON (mobile, shown always) ── */}
      {!vp.md && (
        <button onClick={()=>setShowKeyModal(true)}
          style={{position:"fixed",bottom:showNav?82:20,right:16,zIndex:101,
            background:hasKey?"#142A22":"#1a2810",
            border:`1px solid ${hasKey?"#8BFF6E44":"#FF9F4766"}`,
            borderRadius:20,padding:"8px 14px",
            color:hasKey?"#8BFF6E":"#FF9F47",
            display:"flex",alignItems:"center",gap:6,fontSize:12,
            boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>
          <span style={{fontSize:14}}>{hasKey?"🔑":"⚠️"}</span>
          <span style={{fontFamily:"'Space Mono',monospace",fontSize:9,letterSpacing:1}}>
            {hasKey?"KEY SET":"SET KEY"}
          </span>
        </button>
      )}

      {/* ── BOTTOM NAV (mobile) ── */}
      {showNav && !vp.md && (
        <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:100,
          background:"rgba(10,26,18,0.96)",backdropFilter:"blur(16px)",
          borderTop:"1px solid #1E3828",
          display:"flex",justifyContent:"space-around",padding:"10px 0 20px"}}>
          {NAV.map(t=>(
            <button key={t.id} onClick={()=>go(t.id)}
              style={{background:"none",border:"none",display:"flex",flexDirection:"column",
                alignItems:"center",gap:4,opacity:screen===t.id?1:0.4,transition:"opacity 0.2s"}}>
              <span style={{fontSize:22}}>{t.e}</span>
              <span style={{color:screen===t.id?"#8BFF6E":"#5a7a6a",fontSize:9,
                fontFamily:"'Space Mono',monospace",letterSpacing:1}}>{t.l.toUpperCase()}</span>
            </button>
          ))}
        </div>
      )}

      {/* ── PAGE CONTENT ── */}
      <div style={{maxWidth:maxW,margin:"0 auto",paddingBottom:showNav&&!vp.md?90:0}}>
        {screen==="welcome"  && <WelcomeScreen vp={vp} onSelect={handleRole}/>}
        {screen==="college"  && <CollegeScreen vp={vp} onSelect={c=>{setCollegeId(c.id||c);go("home");}} onBack={()=>setScreen("welcome")}/>}
        {screen==="home"     && <HomeScreen    vp={vp} college={collegeId} onNav={go} onBack={()=>setScreen(role==="student"?"college":"welcome")}/>}
        {screen==="canteen"  && <CanteenScreen vp={vp} college={collegeId||"csm"} onBack={back}/>}
        {screen==="outside"  && <OutsideScreen vp={vp} onBack={back}/>}
        {screen==="selfcook" && <SelfCookScreen vp={vp} onBack={back}/>}
        {screen==="report"   && <ReportScreen  vp={vp} onBack={back}/>}
      </div>

      {/* ── API Key Modal ── */}
      {showKeyModal && <ApiKeyModal onClose={handleKeyClose}/>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
